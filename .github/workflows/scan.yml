# 영드레이더 — 30분마다 작품을 재고, gh-pages 가지에 화면 + 잠근 자료를 새로 올린다.
# gh-pages 는 매번 옛 기록 없이 덮어써서(force push) 저장소가 커지지 않는다. 재던 기록은 그 안 state.enc.json(암호화)에 이어 쌓인다.
# 깃허브 무료 예약(cron)은 몇 시간씩 건너뛰기도 해서(오늘의 흐름 10-31), 한 번 실행되면 그 안에서 5시간 반 동안 스스로 30분마다 돈다.
# 새 실행이 오면 돌던 것을 멈추고 이어받는다(자료는 회차마다 gh-pages 에 올라가 있어 잃지 않음).
name: scan

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 지난 기록 가져오기
        uses: actions/checkout@v4
        continue-on-error: true  # 첫 실행엔 gh-pages 가 없다
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 30분마다 재고 올리기 (한 번에 5시간 반)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
        run: |
          publish() {
            cp index.html style.css site/
            (
              cd site
              rm -rf .git
              touch .nojekyll
              git init -q -b gh-pages
              git add -A
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "자료 $(date '+%Y-%m-%d %H:%M')"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            )
          }
          if [ -z "$RADAR_PASSWORD" ] || [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Secrets 에 RADAR_PASSWORD · YOUTUBE_API_KEY 를 먼저 넣어 주세요"; exit 1
          fi
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            t0=$(date +%s)
            python scan.py --out site --minutes 22 || echo "재기 실패 — 다음 회차에 다시"
            publish || echo "올리기 실패 — 다음 회차에 다시"
            # 한 회차가 길면 40분(거르기 8분 + 재기 22분 + 하루 한 번 배우 일정 + 달마다 후보) → 6시간 끊김 전에 여유 있게 멈춤
            [ $(( $(date +%s) + 45 * 60 )) -lt "$end" ] || break
            left=$(( t0 + 30 * 60 - $(date +%s) ))
            [ "$left" -gt 60 ] && sleep "$left"
          done
